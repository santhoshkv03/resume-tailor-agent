services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: resume_agent_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINIAI_API_KEY=${GEMINIAI_API_KEY}
    env_file:
      - .env

  frontend:
    build:
      context: ./fullstack-app/frontend
      dockerfile: Dockerfile
    container_name: resume_agent_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
